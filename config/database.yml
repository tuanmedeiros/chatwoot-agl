default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('POSTGRES_HOST', 'localhost') %>
  port: <%= ENV.fetch('POSTGRES_PORT', '5432') %>
   # ref: https://github.com/mperham/sidekiq/issues/2985#issuecomment-531097962
  pool: <%= Sidekiq.server? ? ENV.fetch('SIDEKIQ_CONCURRENCY', 10) : ENV.fetch('RAILS_MAX_THREADS', 5) %>
  # frequency in seconds to periodically run the Reaper, which attempts
  # to find and recover connections from dead threads
  reaping_frequency: <%= ENV.fetch('DB_POOL_REAPING_FREQUENCY', 30) %>
  variables:
    # we are setting this value to be close to the racktimeout value. we will iterate and reduce this value going forward
    statement_timeout: <%= ENV["POSTGRES_STATEMENT_TIMEOUT"] || "14s" %>

development:
  <<: *default
  database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_dev') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'postgres') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', '') %>"

test:
  <<: *default
  database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_test') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'postgres') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', '') %>"

production:
  <<: *default
  database: "<%= ENV.fetch('POSTGRES_DATABASE', 'chatwoot_production') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'chatwoot_prod') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', 'chatwoot_prod') %>"

# CRM Database (Kanban) - Supabase PostgreSQL
# Configure these environment variables:
# CRM_DATABASE_URL=postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
crm_default: &crm_default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  # Supabase connection string parsing - must be nil (not empty string) when not set
  url: <%= ENV['CRM_DATABASE_URL'] %>
  # Fallback to individual params if URL not provided
  host: "<%= ENV.fetch('CRM_POSTGRES_HOST', 'aws-0-sa-east-1.pooler.supabase.com') %>"
  port: <%= ENV.fetch('CRM_POSTGRES_PORT', '6543') %>
  database: "<%= ENV.fetch('CRM_POSTGRES_DATABASE', 'postgres') %>"
  username: "<%= ENV.fetch('CRM_POSTGRES_USERNAME', 'postgres.tscrxukrkwnurkzqfjty') %>"
  password: "<%= ENV.fetch('CRM_POSTGRES_PASSWORD', '') %>"
  # SSL required for Supabase
  sslmode: require

crm_development:
  <<: *crm_default

crm_test:
  <<: *crm_default

crm_production:
  <<: *crm_default
