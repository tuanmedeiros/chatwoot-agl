# DO NOT change the order of features EVER
############################################
# name: the name to be used internally in the code
# display_name: the name to be used in the UI
# enabled: whether the feature is enabled by default
# help_url: the url to the help center article
# chatwoot_internal: whether the feature is internal to Chatwoot and should not be shown in the UI for other self hosted installations
# deprecated: purpose of feature flag is done, no need to show it in the UI anymore
############################################
# -> Processamento de e-mails recebidos para transformá-los em tickets.
- name: inbound_emails
  display_name: Inbound Emails
  enabled: true
# -> Permite criar caixas de entrada do tipo E-mail (encaminhamento ou IMAP/SMTP).
- name: channel_email
  display_name: Email Channel
  enabled: true
  help_url: https://agencialendaria.ai/contact?feature=email
# -> Permite conectar páginas do Facebook (Messenger).
- name: channel_facebook
  display_name: Facebook Channel
  enabled: true
  help_url: https://agencialendaria.ai/contact?feature=fb
# -> (Depreciado/Antigo) Integração com Twitter/X. Muitas vezes instável devido à API do X.
- name: channel_twitter
  display_name: Twitter Channel
  enabled: true
  deprecated: true
# -> Detecta a localização (País/Cidade) do usuário baseado no IP. Requer configuração de API Key no servidor.
- name: ip_lookup
  display_name: IP Lookup
  enabled: false
# -> (PREMIUM) Remove o "Powered by Chatwoot" do widget e e-mails. Funciona se ativado no self-hosted.
- name: disable_branding
  display_name: Disable Branding
  enabled: false
  premium: true
# -> Se o usuário sair do chat via API, a conversa continua por e-mail automaticamente.
- name: email_continuity_on_api_channel
  display_name: Email Continuity on API Channel
  enabled: false
# -> Habilita a criação de artigos de base de conhecimento (FAQ) pública.
- name: help_center
  display_name: Help Center
  enabled: false # Default value: `true`
  help_url: https://agencialendaria.ai/contact?feature=help-center
# -> Permite conectar chatbots externos (Dialogflow, Rasa, n8n, Typebot) como "agentes".
- name: agent_bots
  display_name: Agent Bots
  enabled: false # Default value: `true`
  help_url: https://agencialendaria.ai/contact?feature=agent-bots
# -> Habilita o uso de Macros (atalhos para executar múltiplas ações de uma vez na conversa).
- name: macros
  display_name: Macros
  enabled: true
# -> Permite adicionar e gerenciar administradores e agentes.
- name: agent_management
  display_name: Agent Management
  enabled: true
# -> Permite agrupar agentes em Equipes (ex: Vendas, Suporte) para atribuição de conversas.
- name: team_management
  display_name: Team Management
  enabled: true
  help_url: https://agencialendaria.ai/contact?feature=teams
# -> Gerenciamento das caixas de entrada (Canais).
- name: inbox_management
  display_name: Inbox Management
  enabled: true
# -> Uso de etiquetas (tags) para organizar conversas.
- name: labels
  display_name: Labels
  enabled: true
  help_url: https://agencialendaria.ai/contact?feature=labels
# -> Campos personalizados para salvar dados extras do contato (CPF, Plano, ID, etc).
- name: custom_attributes
  display_name: Custom Attributes
  enabled: true
  help_url: https://agencialendaria.ai/contact?feature=custom-attributes
# -> Regras de automação (Ex: Se mensagem contiver "X", atribuir para equipe "Y").
- name: automations
  display_name: Automations
  enabled: true
# -> Respostas prontas/rápidas (digitar /atalho para enviar textos longos).
- name: canned_responses
  display_name: Canned Responses
  enabled: true
  help_url: https://agencialendaria.ai/contact?feature=canned
# -> Menu de integrações (Webhooks, Slack, Dashboard Apps).
- name: integrations
  display_name: Integrations
  enabled: true
  help_url: https://agencialendaria.ai/contact?feature=integrations
# -> Permite gravar e enviar áudio direto do painel do agente.
- name: voice_recorder
  display_name: Voice Recorder
  enabled: true
# -> (Depreciado) Flag antiga para versão 2 do app mobile. Não relevante hoje.
- name: mobile_v2
  display_name: Mobile App V2
  enabled: false
  deprecated: true
# -> O Widget de chat ao vivo para colocar no seu site.
- name: channel_website
  display_name: Website Channel
  enabled: true
# -> Envio de mensagens ativas (Marketing/CSAT) e Campanhas Únicas (WhatsApp/SMS).
- name: campaigns
  display_name: Campaigns
  enabled: true # Default value: `true`
  help_url: https://agencialendaria.ai/contact?feature=campaigns
# -> Painel de relatórios e métricas de atendimento.
- name: reports
  display_name: Reports
  enabled: false # Default value: `true`
  help_url: https://agencialendaria.ai/contact?feature=reports
# -> Lista de contatos (CRM básico interno).
- name: crm
  display_name: CRM
  enabled: true
# -> Opção para fechar conversas automaticamente após X dias sem resposta.
- name: auto_resolve_conversations
  display_name: Auto Resolve Conversations
  enabled: true
# -> Permite configurar um e-mail de resposta personalizado (ex: suporte@suaempresa.com) em vez do padrão.
- name: custom_reply_email
  display_name: Custom Reply Email
  enabled: false
# -> Permite validar domínio próprio para envio de e-mails transacionais.
- name: custom_reply_domain
  display_name: Custom Reply Domain
  enabled: false
# -> (ENTERPRISE) Logs de segurança para ver o que cada agente fez no sistema. Não funciona na Community.
- name: audit_logs
  display_name: Audit Logs
  enabled: false
  premium: true
# -> (Depreciado) Antigo bot interno de resposta automática.
- name: response_bot
  display_name: Response Bot
  enabled: false
  premium: true
  deprecated: true
# -> (Depreciado) Configuração técnica de cabeçalhos de e-mail.
- name: message_reply_to
  display_name: Message Reply To
  enabled: false
  help_url: https://agencialendaria.ai/contact?feature=reply-to
  deprecated: true
# -> (Depreciado) Inserir artigos do Help Center na resposta. (Agora já é nativo).
- name: insert_article_in_reply
  display_name: Insert Article in Reply
  enabled: false
  deprecated: true
# -> Controle interno de visualização da Inbox.
- name: inbox_view
  display_name: Inbox View
  enabled: false
  chatwoot_internal: true
# -> (ENTERPRISE) Gerenciamento de SLA (Prazos de atendimento). Não funciona na Community.
- name: sla
  display_name: SLA
  enabled: false
  premium: true
  help_url: https://agencialendaria.ai/contact?feature=sla
# -> (ENTERPRISE) Busca de artigos dentro do widget do site.
- name: help_center_embedding_search
  display_name: Help Center Embedding Search
  enabled: false
  premium: true
  chatwoot_internal: true
# -> Integração com a ferramenta de gestão de projetos "Linear".
- name: linear_integration
  display_name: Linear Integration
  enabled: false
# -> (ENTERPRISE) "Captain" é o antigo nome da IA do Chatwoot (Copilot).
- name: captain_integration
  display_name: Captain
  enabled: false
  premium: true
# -> (ENTERPRISE) Criação de cargos personalizados (além de Agente/Admin). Não funciona na Community. Função SUPER importante para que agentes não vejam as conversas dos outros, etc.
- name: custom_roles
  display_name: Custom Roles
  enabled: false
  premium: true
# -> Ativa a interface visual da versão 4 (atual). Mantenha true.
- name: chatwoot_v4
  display_name: Chatwoot V4
  enabled: true
# -> (Depreciado) Versão antiga dos relatórios.
- name: report_v4
  display_name: Report V4
