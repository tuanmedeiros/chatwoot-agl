  deprecated: true
# -> (Interno) Botão para falar com suporte do Chatwoot Cloud.
- name: contact_chatwoot_support_team
  display_name: Contact Chatwoot Support Team
  enabled: false # Default value: `true`
  chatwoot_internal: true
# -> (Interno/Beta) Integração nativa com painel Shopify.
- name: shopify_integration
  display_name: Shopify Integration
  enabled: false
  chatwoot_internal: true
# -> (Técnico) Otimização de busca no banco de dados Postgres (GIN Index).
- name: search_with_gin
  display_name: Search messages with GIN
